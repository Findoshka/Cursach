{% extends "base.html" %}

{% block title %}Создание тикета - Система учета заявок{% endblock %}

{% block content %}
<h2>Создание тикета поддержки</h2>

<div class="form">
    <form method="POST">
        <div class="form-group">
            <label for="subject">Тема тикета</label>
            <input type="text" id="subject" name="subject" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="message">Сообщение</label>
            <textarea id="message" name="message" rows="6" required></textarea>
        </div>
        
        <div class="form-actions">
            <a href="{{ url_for('support_chat') }}" class="btn btn-small">Отмена</a>
            <button type="submit" class="btn btn-primary">Создать тикет</button>
        </div>
    </form>
</div>
{% endblock %}
