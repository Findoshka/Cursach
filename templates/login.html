{% extends "base.html" %}

{% block title %}Вход - Система учета заявок{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-form">
        <h2>Добро пожаловать!</h2>
        <p style="color: var(--text-secondary); margin-bottom: 25px; text-align: center;">Войдите в свой аккаунт для продолжения</p>
        
        <form method="POST" class="auth-form-content">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" required autofocus placeholder="ваше_имя_пользователя">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-auth">Войти</button>
            </div>
        </form>
        
        <div class="auth-links">
            <p>Еще нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
            <p><a href="{{ url_for('resend_verification') }}">Не получили письмо с подтверждением?</a></p>
        </div>
    </div>
</div>
{% endblock %}
