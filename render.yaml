services:
  - type: web
    name: cursach
    env: python
    plan: free
    pythonVersion: 3.12.3
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cursach-db
          property: connectionString
      - key: AI_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_ENABLED
        value: true
      - key: AI_API_KEY
        sync: false

databases:
  - name: cursach-db
    plan: free